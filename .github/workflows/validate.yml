name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# No paths-ignore: a filtered-out run never reports required-checks-passed,
# which the ruleset requires, so the PR could never merge.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: drumandbytes/reusable-actions/.github/workflows/go-ci.yml@v1
    with:
      # "1.27", not go.mod: `go 1.27.0` there would pin that exact patch.
      go-version: "1.27"
      dockerfile-path: Dockerfile

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: github-actions-runner-exporter:smoke-test

      # Fake credentials: only proves the container starts and answers /healthz.
      - name: Container starts and serves /healthz
        run: |
          docker run -d --name smoke-test \
            -e GITHUB_ORG=example-org \
            -e GITHUB_TOKEN=fake-token \
            github-actions-runner-exporter:smoke-test
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" != "true" ]; then
            echo "Container exited early:"
            docker logs smoke-test
            exit 1
          fi
          docker run --rm --network container:smoke-test curlimages/curl:latest \
            -sS -f -o /dev/null http://localhost:9222/healthz
          docker rm -f smoke-test

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [lint, smoke-test, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
