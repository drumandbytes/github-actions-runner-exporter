name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# No paths-ignore here on purpose: this workflow hosts required-checks-passed,
# which the org's branch ruleset requires by name on every PR. A path filter
# on the workflow trigger means GitHub never even starts the run for an
# excluded diff (e.g. a docs-only PR) -- not "skipped", just never reported --
# so the ruleset's required check sits at "Expected" forever and the PR can't
# merge. Filter what runs inside jobs (paths-filter, changed-files, etc.) if
# needed, never the trigger.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token; no job here writes to the repo or reads other scopes.
permissions:
  contents: read

jobs:
  lint:
    uses: drumandbytes/reusable-actions/.github/workflows/go-ci.yml@v1
    with:
      # Explicit rather than read from go.mod: its `go 1.27.0` directive
      # would install exactly 1.27.0, while "1.27" gets the latest 1.27.x.
      go-version: "1.27"
      dockerfile-path: Dockerfile

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: github-actions-runner-exporter:smoke-test

      # Fake credentials - never actually connects to the real GitHub API.
      # This only proves the container starts cleanly, listens, and answers
      # /healthz without crashing - not that it can reach a real org.
      - name: Container starts and serves /healthz
        run: |
          docker run -d --name smoke-test \
            -e GITHUB_ORG=example-org \
            -e GITHUB_TOKEN=fake-token \
            github-actions-runner-exporter:smoke-test
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" != "true" ]; then
            echo "Container exited early:"
            docker logs smoke-test
            exit 1
          fi
          docker run --rm --network container:smoke-test curlimages/curl:latest \
            -sS -f -o /dev/null http://localhost:9222/healthz
          docker rm -f smoke-test

  # Audit of this repo's own workflows; accepted findings are in
  # .github/zizmor.yml.
  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # Single stable name for the org's required-status-check ruleset to point
  # at, regardless of how the real jobs above are split or renamed.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [lint, smoke-test, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
