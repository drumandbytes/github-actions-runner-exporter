version: 2
updates:

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Base image bumps (golang:1.27-trixie builder, distroless/static-debian13
  # runtime).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Grouped into a single PR so related action bumps land together rather than
  # as a stream of separate PRs. Auto-merge handles them once CI passes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    # `ci(deps):` — CI-only, no image change, so no release.
    commit-message:
      prefix: "ci"
      include: "scope"
